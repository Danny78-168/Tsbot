name: Threads Auto Post

on:
  schedule:
    # 每天台灣時間中午 12:00 執行 (UTC 時間 04:00)
    - cron: '0 4 * * *'
  # 支援在 GitHub 介面手動點擊按鈕觸發（測試非常方便）
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行發布腳本
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THREADS_ACCOUNTS_JSON: ${{ secrets.THREADS_ACCOUNTS_JSON }}
        run: python main.py
